service: itsm-problemas
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  # AWS Academy: rol del laboratorio de la cuenta donde se despliega.
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    TABLE: ${self:service}-${self:provider.stage}
    TOPIC_ARN: ${cf:itsm-base-${self:provider.stage}.ProblemasTopicArn}

functions:
  crear:
    handler: src/crear.handler
    events:
      - http:
          path: problemas
          method: post
          cors: true
          authorizer: &auth
            name: cognitoAuth
            type: COGNITO_USER_POOLS
            arn: ${cf:itsm-base-${self:provider.stage}.UserPoolArn}
  listar:
    handler: src/listar.handler
    events:
      - http:
          path: problemas
          method: get
          cors: true
          authorizer: *auth
  obtener:
    handler: src/obtener.handler
    events:
      - http:
          path: problemas/{id}
          method: get
          cors: true
          authorizer: *auth
  actualizar:
    handler: src/actualizar.handler
    events:
      - http:
          path: problemas/{id}
          method: put
          cors: true
          authorizer: *auth
  asociar:
    handler: src/asociar.handler
    events:
      - http:
          path: problemas/{id}/incidentes
          method: post
          cors: true
          authorizer: *auth

resources:
  Resources:
    ProblemasTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: tenant_id, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
          - { AttributeName: estado_fecha, AttributeType: S }
        KeySchema:
          - { AttributeName: tenant_id, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - { AttributeName: tenant_id, KeyType: HASH }
              - { AttributeName: estado_fecha, KeyType: RANGE }
            Projection: { ProjectionType: ALL }

    # CORS tambien en errores generados por API Gateway (401 del authorizer,
    # 403 de ruta inexistente, 5xx): sin esto el navegador los muestra como
    # error de CORS y el frontend no puede pedir que se vuelva a iniciar sesion.
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId: !Ref ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId: !Ref ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  Outputs:
    ProblemasApiUrl:
      Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}"
      Export: { Name: "itsm-${self:provider.stage}-ProblemasApiUrl" }
