service: itsm-problemas
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  iam:
    role: arn:aws:iam::777000342473:role/LabRole
  environment:
    TABLE: ${self:service}-${self:provider.stage}
    TOPIC_ARN: ${cf:itsm-base-${self:provider.stage}.ProblemasTopicArn}

functions:
  crear:
    handler: src/crear.handler
    events:
      - http:
          path: problemas
          method: post
          cors: true
          authorizer: &auth
            name: cognitoAuth
            type: COGNITO_USER_POOLS
            arn: ${cf:itsm-base-${self:provider.stage}.UserPoolArn}
  listar:
    handler: src/listar.handler
    events:
      - http:
          path: problemas
          method: get
          cors: true
          authorizer: *auth
  obtener:
    handler: src/obtener.handler
    events:
      - http:
          path: problemas/{id}
          method: get
          cors: true
          authorizer: *auth
  actualizar:
    handler: src/actualizar.handler
    events:
      - http:
          path: problemas/{id}
          method: put
          cors: true
          authorizer: *auth
  asociar:
    handler: src/asociar.handler
    events:
      - http:
          path: problemas/{id}/incidentes
          method: post
          cors: true
          authorizer: *auth

resources:
  Resources:
    ProblemasTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: tenant_id, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
          - { AttributeName: estado_fecha, AttributeType: S }
        KeySchema:
          - { AttributeName: tenant_id, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - { AttributeName: tenant_id, KeyType: HASH }
              - { AttributeName: estado_fecha, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
  Outputs:
    ProblemasApiUrl:
      Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}"
      Export: { Name: "itsm-${self:provider.stage}-ProblemasApiUrl" }
